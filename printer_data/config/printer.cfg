[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE8, EXP1_2=PE7,
    EXP1_3=PE9, EXP1_4=PE10,
    EXP1_5=PE12, EXP1_6=PE13,    # Slot in the socket on this side
    EXP1_7=PE14, EXP1_8=PE15,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PA6, EXP2_2=PA5,
    EXP2_3=PB1, EXP2_4=PA4,
    EXP2_5=PB2, EXP2_6=PA7,      # Slot in the socket on this side
    EXP2_7=PC15, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

# See the sample-lcd.cfg file for definitions of common LCD displays.

# A [probe] section can be defined instead with a pin: setting identical
# to the sensor_pin: for a bltouch
#[bltouch]
#sensor_pin: PB7
#control_pin: PB6
#z_offset: 0

[probe]
pin: EBBCan:PB5
x_offset: 0
y_offset: 0
#z_offset: -0.3
speed: 2
samples: 3
sample_retract_dist: 5
lift_speed: 2
samples_result: average
samples_tolerance: 0.1
activate_gcode:
    {% set PROBE_TEMP = 150 %}
    {% set MAX_TEMP = PROBE_TEMP + 5 %}
    {% set ACTUAL_TEMP = printer.extruder.temperature %}
    {% set TARGET_TEMP = printer.extruder.target %}

    {% if TARGET_TEMP > PROBE_TEMP %}
        { action_respond_info('Extruder temperature target of %.1fC is too high, lowering to %.1fC' % (TARGET_TEMP, PROBE_TEMP)) }
        M109 S{ PROBE_TEMP }
    {% else %}
        # Temperature target is already low enough, but nozzle may still be too hot.
        {% if ACTUAL_TEMP > MAX_TEMP %}
            { action_respond_info('Extruder temperature %.1fC is still too high, waiting until below %.1fC' % (ACTUAL_TEMP, MAX_TEMP)) }
            TEMPERATURE_WAIT SENSOR=extruder MAXIMUM={ MAX_TEMP }
        {% endif %}
    {% endif %}
    

#[neopixel my_neopixel]
#pin: PB0

[force_move]
enable_force_move: True
#   Set to true to enable FORCE_MOVE and SET_KINEMATIC_POSITION
#   extended G-Code commands. The default is false.

[gcode_macro M81]
gcode:
 {action_call_remote_method("set_device_power",device="Printer Power",state="off")}
 

[output_pin PS_ON_OFF]
pin: PE11
value: 1

[gcode_macro End_GCode]
gcode:
  M104 S0 ; Extruder off
  M140 S0 ; Heatbed off
  M107 ; Fan off
  G91 ; relative positioning
  #G1 E-5 F300 ; retract a little
  #G1 Z+20 ; lift print head
  #G28 X5 Y5 ; homing
  M84 ; disable stepper motors
  G90 ; absolute positioning
  TEMPERATURE_WAIT sensor=extruder maximum=60
  #SET_PIN PIN=PS_ON_OFF VALUE=0 ; shut down the printer
  M81

[gcode_button E_Stop]
pin: ^!PG12
press_gcode:
  RESPOND TYPE=command MSG='Shutting Down'
  #M104 S0
  #M140 S0
  #M107
  M84
  #SET_PIN PIN=PS_ON_OFF VALUE=0
  M81

[gcode_macro Power_on]
gcode:
  {action_call_remote_method("set_device_power",device="Reset Power",state="on")}
  {action_call_remote_method("set_device_power",device="Printer Power",state="on")}

[gcode_macro Power_off]
gcode:
  M81

[gcode_macro Emergency_Stop]
gcode:
  M84
  SET_PIN PIN=PS_ON_OFF VALUE=1

[gcode_macro _CURA_SET_PRINT_STATS_INFO]
gcode:
  {% if params.LAYER_COUNT is defined %}
    SET_PRINT_STATS_INFO TOTAL_LAYER={params.LAYER_COUNT}
  {% endif %}
  {% if params.LAYER is defined %}
    SET_PRINT_STATS_INFO CURRENT_LAYER={(params.LAYER | int) + 1}
  {% endif %}

[gcode_macro PRINT_START]
gcode:
    # print_start EXTRUDER=220 BED=60 CHAMBER=0
    {% set BED_TEMP = params.BED_TEMP|default(40)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(40)|float %}
    {% set CHAMBER = params.CHAMBER|default(40)|float %}
    M190 S{BED_TEMP}
    #M109 S{EXTRUDER_TEMP}
    # reset timeout from whatever to 120m, allows for longer heat soak
    SET_IDLE_TIMEOUT TIMEOUT=7200
    STATUS_HEATING

    M117 Preheating Buildplate {BED_TEMP}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}

    # wait for chamber to reach temp using extruder
    # commented out - you should research this
    #TEMPERATURE_WAIT SENSOR=extruder MINIMUM={params.CHAMBER|default(0)}

    # reset timeout back to setting from config file
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

    #M117 Start Preheat HE 150C
    #SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
    #TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150
    STATUS_HOMING

    G28
    # modified QGL, can just use QUAD_GANTRY_LEVEL here
    #G32

    #M117 Clean Nozzle 170C
    #SET_HEATER_TEMPERATURE HEATER=extruder TARGET=170
    #TEMPERATURE_WAIT SENSOR=extruder MINIMUM=170

    # if you are doing such then fix this macro
    #CLEAN_NOZZLE

    #M117 Re-Homing Z
    #SET_HEATER_TEMPERATURE HEATER=extruder TARGET=150
    #TEMPERATURE_WAIT SENSOR=extruder MAXIMUM=150
    #G28 Z
    STATUS_CALIBRATING_Z

    M117 Bed Mesh Calibration
    BED_MESH_CALIBRATE ADAPTIVE=1
    G28 Z
    STATUS_HEATING

    M117 Preheat (Print)
    # set temperatures
    M109 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    STATUS_BUSY

    MMU_CALC_PURGE_VOLUMES SOURCE=gatemap MULTIPLIER=1.1
    
    #SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={BED_TEMP}
    #M104 S{material_print_temperature_layer_0} ; set hotend temp
    #SET_HEATER_TEMPERATURE HEATER=extruder TARGET={EXTRUDER_TEMP}
    #M140 S{material_bed_temperature_layer_0} ; set bed temp

    # wait for bed temperature
    #TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_TEMP}
    #M190 S{material_bed_temperature_layer_0} ; wait for bed
    # wait for nozzle temperature
    #TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER_TEMP}
    #M109 S{material_print_temperature_layer_0} ; wait for hotend

    #Purge Line Gcode
    #M117 Purging...
    #G92 E0
    #G90
    #G0 X5 Y5 F6000
    #G0 Z0.4
    #G91
    # push back some filament after earlier retraction of PRINT_END -14.5
    #G1 E9 F360
    #G1 X120 E30 F1200
    #G1 Y1
    #G1 X-120 E30 F1200
    #G92 E0
    #G90

    #G1 Z15.0 F2400 ; move the platform away by 15mm and little faster
    #G1 X150 Y150 F10000 ; rip it out and tear away string, if there
    #G92 E0 ; zero the extruded length, again
    #G1 F9000 ; resetting speed?!
    SKEW_PROFILE LOAD=calilantern_skew_profile

    #M117 Printing...

[gcode_macro END_PRINT]
gcode:
    SET_SKEW CLEAR=1
    # Turn off bed, extruder, and fan
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    
    # Move nozzle away from print while retracting
    G91
    G1 X0 Y0 E-3 F300
    # Raise nozzle by 10mm
    G1 Z10 F3000
    G90
    G1 X-18 Y181.5 Z325
    
    # Disable steppers
    M84
    STATUS_OFF

